<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentación corporativa — PERCONSUR</title>
<meta name="description" content="Presentación corporativa de PERCONSUR: divisiones Puerto y Campo, equipo, cómo trabajamos, servicios y área de operación.">
<meta name="theme-color" content="#0E1A3C">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter";src:url("assets/fonts/inter-var.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;background:#0A1430;overflow:hidden;overscroll-behavior:none}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* el lienzo mide 1920×1080 como en la presentación y se escala a la ventana; el marco fijo evita que el teléfono aleje la vista */
#marco{position:fixed;inset:0;overflow:hidden}
#marco{touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
#escenario{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;visibility:hidden}
.slide.activa,.slide.saliendo{visibility:visible}
.slide.saliendo{z-index:1}
.slide.activa{z-index:2}
.slide *{box-sizing:border-box;margin:0}
.slide div:not([style*="display"]){display:flex;flex-direction:column}
.slide h1{font-size:96px;font-weight:600;line-height:1.1}
.slide h2{font-size:64px;font-weight:600;line-height:1.15}
.slide h3{font-size:44px;font-weight:600;line-height:1.2}
.slide p{font-size:32px;line-height:1.4}
.slide img{display:block}
.slide table{border-collapse:collapse;width:100%}
.slide td,.slide th{padding:.5em .6em;text-align:left;vertical-align:top;border-bottom:1px solid #DFE3EA}
.slide th{border-bottom-color:#0E1A3C}
.slide ul{padding-left:1.1em}
.slide li{padding-left:.2em}
.slide .ico{display:block;flex:none}

/* controles */
.progreso{position:fixed;left:0;top:0;right:0;height:4px;background:rgba(255,255,255,.08);z-index:5}
.progreso span{display:block;height:100%;width:0;background:#6E8BE8;transition:width .5s cubic-bezier(.65,0,.35,1)}
.barra{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(14,26,60,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:5;transition:opacity .4s ease,transform .4s ease}
.barra.oculta{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.barra button,.barra a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#F4F5F7;font:500 15px/1 "Inter",Arial,sans-serif;text-decoration:none;cursor:pointer}
.barra svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barra button:disabled{opacity:.35;cursor:default}
.barra .cuenta{min-width:72px;text-align:center;color:#C9D3EA;font:500 15px/1 "Inter",Arial,sans-serif;font-variant-numeric:tabular-nums}
.barra .sep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 4px}
.barra :focus-visible{outline:3px solid rgba(110,139,232,.8);outline-offset:0}
.barra #sonido[aria-pressed="false"] .on,.barra #sonido[aria-pressed="true"] .off{display:none}
@media (hover:hover){.barra button:not(:disabled):hover,.barra a:hover{background:rgba(255,255,255,.12)}}
.gira{display:none}
@media (orientation:portrait) and (max-width:700px){
  .gira{display:block;position:fixed;left:0;right:0;top:calc(50% + 31vw);text-align:center;color:#8E9BBF;font:500 14px/1.4 "Inter",Arial,sans-serif;z-index:4;pointer-events:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<noscript><style>
html,body{overflow:auto;height:auto}
#marco{position:static;overflow:visible}
#escenario{position:static;transform:none;width:1920px;height:auto;zoom:.25;cursor:auto}
@media (min-width:960px){#escenario{zoom:.5}}
@media (min-width:1440px){#escenario{zoom:.75}}
.slide{position:relative;visibility:visible;margin-bottom:24px}
.barra,.progreso,.gira{display:none}
</style></noscript>
</head>
<body>
<div class="progreso" aria-hidden="true"><span></span></div>
<div id="marco">
<main id="escenario" aria-label="Presentación">
<!--DIAPOSITIVAS-->
</main>
</div>
<p class="gira" aria-hidden="true">Gira tu teléfono para verla más grande</p>
<nav class="barra" aria-label="Controles de la presentación">
  <a href="./" aria-label="Volver a perconsur.mx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="ant" aria-label="Diapositiva anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="cuenta" id="cuenta" aria-live="polite">1 / 11</span>
  <button type="button" id="sig" aria-label="Diapositiva siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="sonido" aria-pressed="true" aria-label="Sonido"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
  <button type="button" id="pantalla" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<script>
(function(){
  'use strict';
  var esc = document.getElementById('escenario'), marco = document.getElementById('marco');
  var slides = [].slice.call(document.querySelectorAll('.slide')), N = slides.length;
  var cuenta = document.getElementById('cuenta'), ant = document.getElementById('ant'), sig = document.getElementById('sig');
  var barra = document.querySelector('.barra'), prog = document.querySelector('.progreso span');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i = 0, escala = 1, anims = [];

  function ajusta(){
    var w = window.innerWidth, h = window.innerHeight; escala = Math.min(w / 1920, h / 1080);
    esc.style.transform = 'translate(' + (w - 1920 * escala) / 2 + 'px,' + (h - 1080 * escala) / 2 + 'px) scale(' + escala + ')';
  }
  window.addEventListener('resize', ajusta); ajusta();

  // entradas de los elementos (data-build-in="tipo orden auto")
  var EF = {
    fade:  [{opacity:0},{opacity:1}],
    rise:  [{opacity:0,transform:'translateY(28px)'},{opacity:1,transform:'none'}],
    drop:  [{opacity:0,transform:'translateY(-60px)'},{opacity:1,transform:'none'}],
    left:  [{opacity:0,transform:'translateX(-360px)'},{opacity:1,transform:'none'}],
    right: [{opacity:0,transform:'translateX(360px)'},{opacity:1,transform:'none'}],
    scale: [{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],
    pop:   [{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1.06)',offset:.7},{opacity:1,transform:'none'}]
  };
  // Sonido con Web Audio, sin archivos: un barrido suave de aire en cada transición y un tono corto
  // (escala pentatónica) por cada elemento que aparece. Arranca con la primera interacción, como piden
  // los navegadores, y se puede silenciar; la preferencia se recuerda en este navegador.
  var sonido = (function(){
    var ctx = null, maestro = null, activo = true, listo = false, vivos = [];
    try { activo = localStorage.getItem('perconsur-presentacion-sonido') !== 'no'; } catch(e){}
    var NOTAS = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    function abre(){
      if(ctx) return ctx;
      var C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
      ctx = new C(); maestro = ctx.createGain(); maestro.gain.value = 0.9; maestro.connect(ctx.destination);
      return ctx;
    }
    function despierta(){ listo = true; var c = abre(); if(c && c.state === 'suspended') c.resume(); }
    function puede(){ return activo && listo && abre() && ctx.state !== 'closed'; }
    function sigue(n){ vivos.push(n); n.onended = function(){ var k = vivos.indexOf(n); if(k >= 0) vivos.splice(k, 1); }; }
    return {
      despierta: despierta,
      activo: function(){ return activo; },
      cambia: function(v){ activo = v; try { localStorage.setItem('perconsur-presentacion-sonido', v ? 'si' : 'no'); } catch(e){} if(!v) this.para(); },
      para: function(){ var t = ctx ? ctx.currentTime : 0; vivos.slice().forEach(function(n){ try { n.stop(t); } catch(e){} }); vivos = []; },
      transicion: function(dir){
        if(!puede()) return;
        var t = ctx.currentTime, dur = 0.55;
        var buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), d = buf.getChannelData(0);
        for(var k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
        var ruido = ctx.createBufferSource(); ruido.buffer = buf;
        var filtro = ctx.createBiquadFilter(); filtro.type = 'bandpass'; filtro.Q.value = 0.7;
        filtro.frequency.setValueAtTime(dir > 0 ? 500 : 2200, t); filtro.frequency.exponentialRampToValueAtTime(dir > 0 ? 2200 : 500, t + dur);
        var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.16); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        ruido.connect(filtro); filtro.connect(g); g.connect(maestro); ruido.start(t); ruido.stop(t + dur); sigue(ruido);
        var o = ctx.createOscillator(), g2 = ctx.createGain(); o.type = 'sine';
        o.frequency.setValueAtTime(196, t); o.frequency.exponentialRampToValueAtTime(147, t + 0.4);
        g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.045, t + 0.03); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        o.connect(g2); g2.connect(maestro); o.start(t); o.stop(t + 0.5); sigue(o);
      },
      elemento: function(orden, retraso){
        if(!puede()) return;
        var t = ctx.currentTime + retraso, f = NOTAS[(orden - 1) % NOTAS.length];
        [[f, 0.032, 'sine'], [f * 2, 0.008, 'triangle']].forEach(function(p){
          var o = ctx.createOscillator(), g = ctx.createGain(); o.type = p[2]; o.frequency.setValueAtTime(p[0], t);
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p[1], t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
          o.connect(g); g.connect(maestro); o.start(t); o.stop(t + 0.35); sigue(o);
        });
      }
    };
  })();
  ['pointerdown', 'keydown'].forEach(function(ev){ document.addEventListener(ev, sonido.despierta, { capture: true }); });
  var btnS = document.getElementById('sonido');
  function pintaSonido(){ var on = sonido.activo(); btnS.setAttribute('aria-pressed', String(on)); btnS.setAttribute('aria-label', on ? 'Silenciar sonido' : 'Activar sonido'); }
  btnS.addEventListener('click', function(){ sonido.cambia(!sonido.activo()); pintaSonido(); });
  pintaSonido();

  function anima(el, kf, op){ var a = el.animate(kf, op); anims.push(a); return a; }
  function para(){ anims.forEach(function(a){ a.cancel(); }); anims = []; slides.forEach(function(s){ s.classList.remove('saliendo'); }); }
  function construye(s, omitir){
    if(reduce) return;
    [].forEach.call(s.querySelectorAll('[data-build-in]'), function(el){
      if(omitir.indexOf(el) >= 0) return;
      var p = el.getAttribute('data-build-in').split(/\s+/), tipo = EF[p[0]] ? p[0] : 'fade', orden = parseInt(p[1], 10) || 1;
      var retraso = 300 + (orden - 1) * 170;
      anima(el, EF[tipo], { duration: tipo === 'left' || tipo === 'right' ? 800 : 650, delay: retraso, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
      sonido.elemento(orden, retraso / 1000);
    });
  }
  function estado(){
    slides.forEach(function(s, k){ var on = k === i; if(on) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true'); s.inert = !on; });
    cuenta.textContent = (i + 1) + ' / ' + N;
    ant.disabled = i === 0; sig.disabled = i === N - 1;
    prog.style.width = ((i + 1) / N * 100) + '%';
    if(history.replaceState) history.replaceState(null, '', '#' + (i + 1));
  }
  // la transición la define la diapositiva que se deja: fade, push o magic (mueve el elemento compartido)
  function ir(n){
    if(n < 0 || n >= N || n === i) return;
    para();
    var a = slides[i], b = slides[n], dir = n > i ? 1 : -1;
    var t = (dir > 0 ? a : b).getAttribute('data-transition') || 'fade';
    if(t === 'magic' && Math.abs(n - i) > 1) t = 'fade';
    a.classList.remove('activa'); a.classList.add('saliendo'); b.classList.add('activa');
    var ease = 'cubic-bezier(.65,0,.35,1)', fin, magicos = [];
    sonido.para(); sonido.transicion(dir);
    if(reduce || t === 'fade'){
      anima(b, [{opacity:0},{opacity:1}], { duration: reduce ? 250 : 650, easing: 'ease' });
      fin = anima(a, [{opacity:1},{opacity:0}], { duration: reduce ? 250 : 650, easing: 'ease' });
    } else if(t === 'push'){
      anima(b, [{transform:'translateX(' + dir * 1920 + 'px)'},{transform:'none'}], { duration: 750, easing: ease });
      fin = anima(a, [{transform:'none'},{transform:'translateX(' + -dir * 1920 + 'px)'}], { duration: 750, easing: ease });
    } else {
      [].forEach.call(b.querySelectorAll('[data-magic]'), function(el){
        var o = a.querySelector('[data-magic="' + el.getAttribute('data-magic') + '"]'); if(!o) return;
        var r1 = o.getBoundingClientRect(), r2 = el.getBoundingClientRect(); magicos.push(el);
        anima(el, [{transformOrigin:'0 0',transform:'translate(' + (r1.left - r2.left) / escala + 'px,' + (r1.top - r2.top) / escala + 'px) scale(' + r1.width / r2.width + ',' + r1.height / r2.height + ')'},{transformOrigin:'0 0',transform:'none'}], { duration: 950, easing: ease });
        anima(o, [{opacity:0},{opacity:0}], { duration: 950 });
      });
      anima(b, [{opacity:0},{opacity:1}], { duration: 380, easing: 'ease-out' });
      fin = anima(a, [{opacity:1},{opacity:0}], { duration: 700, easing: 'ease' });
    }
    fin.onfinish = function(){ a.classList.remove('saliendo'); };
    construye(b, magicos);
    i = n; estado();
  }
  function siguiente(){ ir(i + 1); }
  function anterior(){ ir(i - 1); }

  sig.addEventListener('click', siguiente);
  ant.addEventListener('click', anterior);
  document.addEventListener('keydown', function(e){
    if(e.altKey || e.ctrlKey || e.metaKey) return;
    var enControl = e.target.closest && e.target.closest('button, a');
    var k = e.key;
    if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (!enControl && (k === ' ' || k === 'Enter'))){ e.preventDefault(); siguiente(); }
    else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace'){ e.preventDefault(); anterior(); }
    else if(k === 'Home'){ e.preventDefault(); ir(0); }
    else if(k === 'End'){ e.preventDefault(); ir(N - 1); }
    else if(k === 'f' || k === 'F'){ pantalla(); }
    else if(k === 'm' || k === 'M'){ sonido.cambia(!sonido.activo()); pintaSonido(); }
  });
  // toque o clic: a la izquierda regresa, en el resto avanza; deslizar también cambia de diapositiva
  var x0 = null, y0 = null;
  marco.addEventListener('pointerdown', function(e){ x0 = e.clientX; y0 = e.clientY; });
  marco.addEventListener('pointerup', function(e){
    if(x0 === null) return;
    var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ if(dx < 0) siguiente(); else anterior(); return; }
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10){ if(e.clientX < window.innerWidth * 0.3) anterior(); else siguiente(); }
  });

  var btnP = document.getElementById('pantalla'), raiz = document.documentElement;
  function pantalla(){
    if(!raiz.requestFullscreen) return;
    if(document.fullscreenElement) document.exitFullscreen(); else raiz.requestFullscreen().catch(function(){});
  }
  if(!raiz.requestFullscreen) btnP.hidden = true;
  btnP.addEventListener('click', pantalla);
  document.addEventListener('fullscreenchange', function(){ btnP.setAttribute('aria-label', document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'); });

  // la barra se esconde para no tapar la diapositiva y vuelve al mover el ratón o tocar la pantalla
  var reloj = 0;
  var muestra = function(){ barra.classList.remove('oculta'); clearTimeout(reloj); reloj = setTimeout(function(){ if(!barra.contains(document.activeElement)) barra.classList.add('oculta'); }, 2800); };
  document.addEventListener('pointermove', muestra); document.addEventListener('pointerdown', muestra); barra.addEventListener('focusin', muestra); muestra();

  var inicial = parseInt((location.hash || '').slice(1), 10);
  i = inicial >= 1 && inicial <= N ? inicial - 1 : 0;
  slides[i].classList.add('activa'); estado(); construye(slides[i], []);
})();
</script>
</body>
</html>
