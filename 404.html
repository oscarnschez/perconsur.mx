<!DOCTYPE html>

@font-face{font-family:"Inter Display";src:url("/assets/fonts/inter-display-600.woff2") format("woff2");font-weight:600;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:flex;flex-direction:column;background:#F5F5F7;color:#1D1D1F;font:17px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}

header img{height:44px;width:auto;display:block}
main{flex:1;display:grid;place-content:center;gap:16px;padding:40px clamp(20px,4vw,40px) 96px;text-align:center}
p.codigo{font-weight:600;color:#2F4CA8}
h1{font-family:"Inter Display","Inter",sans-serif;font-weight:600;font-size:clamp(34px,4.4vw,56px);line-height:1.07;letter-spacing:-.028em;text-wrap:balance}
p.lede{max-width:34em;margin-inline:auto;color:#5F6068;font-size:19px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:500;text-decoration:none;background:#2F4CA8;color:#fff}
a.quieto{background:#EBEBEF;color:#1D1D1F}
a:focus-visible{outline:3px solid rgba(47,76,168,.42);outline-offset:3px}
@media (hover:hover){a:hover{background:#243C8A}a.quieto:hover{background:#E0E0E5}}
